name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: compila, roda os testes unitários e de integração e confere a cobertura (mvn verify).
  build:
    runs-on: ubuntu-latest

    # PostgreSQL de verdade, só para esta execução, para os testes de integração (*IT).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenda_clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/agenda_clinica_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, testes e cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar o relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco

  # Job 2: prova que o projeto sobe "do zero" só com Docker, como o README promete.
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Criar .env descartável
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=ci-db-password
          JWT_SECRET=ci-jwt-secret-com-mais-de-32-caracteres-123
          ADMIN_PASSWORD=ci-admin-password
          APP_PORT=8081
          EOF

      - name: Subir API e banco com Docker Compose
        run: docker compose up -d --build

      - name: Esperar a API responder no health
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/actuator/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Fazer login e chamar uma rota protegida
        run: |
          TOKEN=$(curl -fs -X POST http://localhost:8081/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@agendaclinica.com","senha":"ci-admin-password"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          curl -fs http://localhost:8081/pacientes -H "Authorization: Bearer $TOKEN" | head -c 300

      - name: Logs dos containers (se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Derrubar
        if: always()
        run: docker compose down -v
