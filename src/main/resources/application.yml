server:
  # 8080 costuma estar ocupada (Apache/XAMPP); mude com a variável SERVER_PORT.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: agenda-clinica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda_clinica}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  autoconfigure:
    # Sem isso o Spring cria um usuário "user" com senha aleatória no log; usamos nossa própria tabela.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      # O schema é do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    # Obrigatório e sem valor padrão: um segredo padrão no repositório seria uma brecha.
    # Mínimo de 32 caracteres (HS256).
    secret: ${JWT_SECRET}
    expiration-minutes: 120
  admin:
    # Admin inicial, criado na primeira subida se ainda não existir nenhum ADMIN.
    email: ${ADMIN_EMAIL:admin@agendaclinica.com}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
